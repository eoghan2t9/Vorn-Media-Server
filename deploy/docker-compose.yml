services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vorn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vorn}
      POSTGRES_DB: ${POSTGRES_DB:-vorn}
    volumes:
      - vorn_postgres_data:/var/lib/postgresql/data
    # No host port published: only the backend container needs to reach
    # Postgres, over the internal compose network (service name "postgres").
    # Uncomment if you want host-side psql access, adjusting the host port
    # if 5432 is already taken there:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vorn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    # No host port published (same reasoning as postgres above, and it also
    # avoids colliding with any other Redis-protocol service already using
    # 6379 on the host). Uncomment to expose it directly:
    # ports:
    #   - "6379:6379"
    volumes:
      - vorn_dragonfly_data:/data

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started
    environment:
      VORN_HTTP_ADDR: ":8080"
      VORN_POSTGRES_DSN: "postgres://${POSTGRES_USER:-vorn}:${POSTGRES_PASSWORD:-vorn}@postgres:5432/${POSTGRES_DB:-vorn}?sslmode=disable"
      VORN_DRAGONFLY_ADDR: "dragonfly:6379"
      # Must match the origin the browser actually loads the frontend from
      # (see VORN_API_BASE below, on the frontend service) -- CORS requires
      # an exact match for credentialed (cookie-based) requests.
      VORN_CORS_ORIGIN: "${VORN_FRONTEND_ORIGIN:-http://localhost:5173}"
      VORN_TORRENT_ENABLED: "${VORN_TORRENT_ENABLED:-false}"
      VORN_TORRENT_DOWNLOAD_DIR: "/downloads"
      # Optional: auto-mirror indexers configured inside a Prowlarr instance
      # into Vorn's own Torrent Indexers and/or NZB Indexers pages (Prowlarr
      # manages both torrent trackers and Usenet indexers -- each syncs into
      # whichever of VORN_TORRENT_ENABLED/VORN_NZB_ENABLED is turned on) --
      # set VORN_PROWLARR_BASE_URL (e.g. http://prowlarr:9696 when using the
      # bundled "prowlarr" Compose profile below) to enable it. The API key
      # is read automatically from Prowlarr's own config.xml via the
      # read-only mount further down; VORN_PROWLARR_API_KEY can be set
      # instead to skip that (e.g. pointing at an external Prowlarr you
      # already run, without sharing its volume).
      VORN_PROWLARR_BASE_URL: "${VORN_PROWLARR_BASE_URL:-}"
      VORN_PROWLARR_API_KEY: "${VORN_PROWLARR_API_KEY:-}"
      VORN_PROWLARR_CONFIG_PATH: "/prowlarr-config/config.xml"
      VORN_NZB_ENABLED: "${VORN_NZB_ENABLED:-false}"
      VORN_NZB_DOWNLOAD_DIR: "/nzb-downloads"
      VORN_OPENSUBTITLES_API_KEY: "${VORN_OPENSUBTITLES_API_KEY:-}"
      VORN_OPENSUBTITLES_USERNAME: "${VORN_OPENSUBTITLES_USERNAME:-}"
      VORN_OPENSUBTITLES_PASSWORD: "${VORN_OPENSUBTITLES_PASSWORD:-}"
      VORN_SUBTITLES_CACHE_DIR: "/subtitles-cache"
      VORN_ARTWORK_CACHE_DIR: "/artwork-cache"
      VORN_BACKUP_DIR: "/backups"
    ports:
      - "8080:8080"
      - "${VORN_TORRENT_PEER_PORT:-42069}:42069/tcp"
      - "${VORN_TORRENT_PEER_PORT:-42069}:42069/udp"
      # If you enable custom-domain SSL via Admin > Network, uncomment these
      # (and consider removing the 8080 mapping above, since certmagic takes
      # over serving on 80/443 instead):
      # - "80:80"
      # - "443:443"
    volumes:
      - ${VORN_LIBRARY_PATH:-./data/library}:/media:ro
      - ${VORN_TORRENT_DOWNLOAD_PATH:-./data/downloads}:/downloads
      - ${VORN_NZB_DOWNLOAD_PATH:-./data/nzb-downloads}:/nzb-downloads
      - ${VORN_SUBTITLES_CACHE_PATH:-./data/subtitles-cache}:/subtitles-cache
      - ${VORN_ARTWORK_CACHE_PATH:-./data/artwork-cache}:/artwork-cache
      - ${VORN_BACKUP_PATH:-./data/backups}:/backups
      # Read-only -- only Prowlarr itself needs write access. Harmless if
      # the "prowlarr" profile isn't in use; nothing reads from it unless
      # VORN_PROWLARR_BASE_URL is also set above.
      - ${VORN_PROWLARR_DATA_PATH:-./data/prowlarr}:/prowlarr-config:ro
    # --- GPU passthrough (uncomment the block matching your hardware) ---
    #
    # Nvidia (requires the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    #
    # Intel QuickSync / AMD VAAPI (Linux render nodes):
    # devices:
    #   - /dev/dri:/dev/dri

  # Optional: bundles Prowlarr as a managed sidecar instead of requiring a
  # separately-run instance. Off by default -- start with `docker compose
  # --profile prowlarr up -d` (or set COMPOSE_PROFILES=prowlarr), then also
  # set VORN_PROWLARR_BASE_URL=http://prowlarr:9696 above so the backend
  # picks it up. You'll still visit its own UI (the exposed port below)
  # once to add trackers -- that per-site configuration is what Prowlarr is
  # for and bundling it doesn't remove that step, it just means Vorn learns
  # about whatever you add there automatically instead of needing each
  # indexer's URL/API key copied in by hand.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    profiles:
      - prowlarr
    environment:
      PUID: "${VORN_PUID:-1000}"
      PGID: "${VORN_PGID:-1000}"
      TZ: "${VORN_TZ:-UTC}"
    volumes:
      - ${VORN_PROWLARR_DATA_PATH:-./data/prowlarr}:/config
    ports:
      - "${VORN_PROWLARR_PORT:-9696}:9696"

  # Optional: solves Cloudflare's JS challenge for indexers that sit behind
  # it (a real headless browser under the hood, not a raw HTTP client, so
  # it can pass what a plain request from Prowlarr can't). Same "off by
  # default" shape as prowlarr above -- start it with the same `--profile
  # prowlarr up -d` (it shares that profile since it's a Prowlarr
  # companion, not a standalone feature), then in Prowlarr's own UI go to
  # Settings > Indexer Proxies > Add > FlareSolverr, host
  # http://flaresolverr:8191, and assign it to whichever indexer(s)
  # actually need it (Settings > Indexers > edit > Indexer Proxy) -- it
  # isn't applied automatically to every indexer.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    profiles:
      - prowlarr
    environment:
      LOG_LEVEL: "info"
      TZ: "${VORN_TZ:-UTC}"
    ports:
      - "${VORN_FLARESOLVERR_PORT:-8191}:8191"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Override with the address your browser will actually reach the
      # backend at (e.g. a server's public IP/domain) if it's not the same
      # machine you're browsing from.
      VITE_VORN_API_BASE: "${VORN_API_BASE:-http://localhost:8080}"
    ports:
      - "5173:5173"

volumes:
  vorn_postgres_data:
  vorn_dragonfly_data:
